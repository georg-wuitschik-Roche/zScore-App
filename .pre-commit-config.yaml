repos:
  - repo: local
    hooks:
      - id: regenerate-csv-artifacts
        name: Regenerate Parquet + dropdown index from CSV
        entry: python3 scripts/regenerate_from_csv.py
        language: python
        files: '^z-Score Peaks with FG\.csv$'
        pass_filenames: false
        additional_dependencies: [pandas>=2.0, numpy>=1.24, pyarrow>=14.0]

      - id: version-dataset
        name: Auto-version new dataset CSVs
        entry: python3 scripts/version_dataset.py
        language: python
        files: '^add-dataset/.*\.csv$'
        pass_filenames: false
        additional_dependencies: [pandas>=2.0, numpy>=1.24, pyarrow>=14.0]

      - id: tsc
        name: TypeScript type check
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        files: '^frontend/src/.*\.(ts|tsx)$'
        pass_filenames: false

      - id: vitest
        name: Vitest tests
        entry: bash -c 'cd frontend && npx vitest run --reporter=dot'
        language: system
        stages: [pre-push]
        files: '^frontend/'
        pass_filenames: false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
]
ignore = [
    "E501",   # line too long — handled by line-length setting
    "N802",   # function name should be lowercase — Dash callbacks use mixed
    "N803",   # argument name should be lowercase — DataFrame column names
    "N806",   # variable in function should be lowercase — DataFrame vars
    "N999",   # invalid module name — existing file names
    "B905",   # zip without strict= — not needed for data pipelines
    "SIM108", # ternary operator — readability preference
    "E402",   # module import not at top — all files use module docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["data_utils", "plot_utils", "layout", "callbacks"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
# Relaxed for now — tighten as type coverage improves:
check_untyped_defs = false
warn_return_any = false
no_implicit_optional = false
# Suppress pandas/numpy type-stub noise:
disable_error_code = ["operator", "arg-type", "return-value", "assignment", "attr-defined", "str-bytes-safe"]
